<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underground Gaming - Premium Fixed</title>
    <style>
        /* --- GLOBAL & COMMON STYLES --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1d3a, #16294a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 25px 0;
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
            letter-spacing: 2px;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00f3ff;
            color: #fff;
            padding: 8px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #00f3ff;
            color: #0b1d3a;
            box-shadow: 0 0 15px #00f3ff;
        }

        .main-container {
            display: flex;
            width: 95%;
            max-width: 1400px;
            justify-content: center;
            margin: 0 auto 40px auto;
            gap: 0px; /* Shuruat mein 0px rahega taaki icons ko poori jagah mile */
            padding: 20px;
            box-sizing: border-box;
        }

        .game-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            width: 100%;
        }

        /* Top Play Ad Banner */
        .top-banner-ad {
            width: 100%;
            max-width: 900px;
            height: 90px;
            background: #071426;
            border: 2px solid #00f3ff;
            border-radius: 8px;
            display: none; 
            justify-content: center;
            align-items: center;
            color: #00f3ff;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        /* Video Game Container */
        .video-game-container {
            position: relative; 
            width: 100%;
            max-width: 900px; 
            height: 520px; 
            background: #000; 
            border: 3px solid #00f3ff;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            overflow: hidden;
            display: none;
            margin-bottom: 30px;
        }
        .video-game-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }
     
        /* Fullscreen Button ka design */
        #fullscreenBtn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 243, 255, 0.85);
            color: #0b1d3a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        #fullscreenBtn:hover {
            background: #fff;
            box-shadow: 0 0 15px #00f3ff;
            transform: scale(1.05);
        }

        /* --- LAPTOP / DESKTOP INLINE AD & GRID (6 ITEMS PER ROW) --- */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            width: 100%;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00f3ff;
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.2);
        }

        .game-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #16294a;
        }

        .game-card h3 {
            font-size: 0.95rem;
            margin: 10px 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-transform: capitalize;
        }

        /* Huge Inline Laptop Banner */
        .laptop-inline-ad {
            grid-column: span 6;
            height: 140px;
            background: #071426;
            border: 2px dashed #00f3ff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00f3ff;
            font-weight: bold;
            font-size: 1.2rem;
            margin: 10px 0;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.1);
        }

        /* --- SIDE ADS PERFECT BOX ENGINE --- */
        .side-ad {
            display: none; /* Pehle se hide rahega taaki icons ko poori space mile */
            width: 160px;
            background: #071426;
            border: 2px dashed #00f3ff;
            border-radius: 8px;
            color: #00f3ff;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            box-sizing: border-box;
            height: 625px; 
            flex-shrink: 0;
        }

        .side-ad span {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* --- 📱 PREMIUM MOBILE RESPONSIVE ENGINE --- */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.9rem;
            }

            .main-container {
                width: 96%;
                gap: 0px !important;
            }

            .games-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 10px;
            }

            .game-card img {
                height: 90px;
            }

            .game-card h3 {
                font-size: 0.8rem;
            }

            .mobile-hero-feature {
                grid-column: span 3;
                background: rgba(255, 255, 255, 0.04);
                border: 2px solid #00f3ff;
                border-radius: 14px;
                padding: 12px;
                cursor: pointer;
                text-align: center;
                box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            }

            .mobile-hero-feature img {
                width: 100%;
                height: 180px;
                object-fit: cover;
                border-radius: 10px;
            }

            .mobile-hero-feature h3 {
                font-size: 1.2rem;
                color: #00f3ff;
                margin: 10px 0 2px 0;
            }

            .mobile-loop-ad {
                grid-column: span 3;
                height: 80px;
                background: #071426;
                border: 2px dashed #ff007c;
                border-radius: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
                color: #ff007c;
                font-weight: bold;
                font-size: 0.9rem;
                margin: 10px 0;
            }

            .video-game-container {
                height: 280px;
                border-width: 2px;
            }

            .top-banner-ad {
                height: 65px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>UNDERGROUND GAMING</h1>
    </header>

    <div class="filters">
        <button class="filter-btn active" onclick="filterCat('All')">All Games</button>
        <button class="filter-btn" onclick="filterCat('Action')">Action</button>
        <button class="filter-btn" onclick="filterCat('Racing')">Racing</button>
        <button class="filter-btn" onclick="filterCat('Retro')">Retro</button>
    </div>

    <div class="main-container" id="mainContainer">
        
        <div class="side-ad" id="leftAdBox">
            <span>[ AD BANNER ]</span>
        </div>

        <div class="game-zone" id="gameZoneBox">
            
            <div class="top-banner-ad" id="topAdSlot">
                <span>[ GOOGLE RESPONSIVE BANNER AD ]</span>
            </div>

            <div class="video-game-container" id="gameBox">
                <button id="fullscreenBtn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
                <iframe id="gameFrame" src="" allowfullscreen></iframe>
            </div>

            <div class="games-grid" id="gridBox"></div>

            <h2 id="moreGamesTitle" style="display: none; color: #00f3ff; margin-top: 30px; font-size: 1.4rem; text-align: left; width: 100%; border-bottom: 1px solid rgba(0,243,255,0.2); padding-bottom: 5px;">More Awesome Games</h2>

        </div> 
        
        <div class="side-ad" id="rightAdBox">
            <span>[ AD BANNER ]</span>
        </div>

    </div>

    <script>
        // --- 100% CLEANED DATABASE ---
        const gamesDatabase = [
            { title: "Drive Quest", cat: "Racing", img: "https://images.unsplash.com/photo-1547949003-9792a18a2601?w=400", url: "https://playgama.com/export/game/drive-quest" },
            { title: "Flappy Bird Classic", cat: "Action", img: "https://images.unsplash.com/photo-1551103782-8ab07afd45c1?w=400", url: "./flappy/index.html" },
            { title: "Pac-Man Retro", cat: "Retro", img: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400", url: "https://pacman.live/play.html" },
            { title: "Thief Puzzle", cat: "Action", img: "https://images.unsplash.com/photo-1553481187-be93c21490a9?w=400", url: "https://playgama.com/export/game/drive-quest" },
            { title: "Paper.io 2", cat: "Racing", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400", url: "./flappy/index.html" },
            { title: "Stickman Rebirth", cat: "Retro", img: "https://images.unsplash.com/photo-1552820728-8b83bb6b773f?w=400", url: "https://pacman.live/play.html" },
            { title: "Bloxd.io", cat: "Action", img: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=400", url: "https://playgama.com/export/game/drive-quest" },
            { title: "Deadly Descent", cat: "Racing", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400", url: "./flappy/index.html" },
            { title: "Piece of Cake", cat: "Retro", img: "https://images.unsplash.com/photo-1522069169874-c58ec4b76be5?w=400", url: "https://pacman.live/play.html" },
            { title: "Speed Racer", cat: "Racing", img: "https://images.unsplash.com/photo-1560253023-3ec5d502959f?w=400", url: "https://playgama.com/export/game/drive-quest" },
            { title: "Space Invaders", cat: "Retro", img: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=400", url: "https://pacman.live/play.html" },
            { title: "Super Sonic", cat: "Action", img: "https://images.unsplash.com/photo-1548685913-fe6574340a49?w=400", url: "./flappy/index.html" }
        ];

        let currentActiveList = [...gamesDatabase];
        let isModeActive = false;

        function playGame(game) {
            const gameFrame = document.getElementById('gameFrame');
            const gameBox = document.getElementById('gameBox');
            const topAd = document.getElementById('topAdSlot');
            const dynamicTitle = document.getElementById('moreGamesTitle');
            
            // AD ELEMENTS & LAYOUT CONTAINERS
            const leftAd = document.getElementById('leftAdBox');
            const rightAd = document.getElementById('rightAdBox');
            const mainContainer = document.getElementById('mainContainer');
            const gameZoneBox = document.getElementById('gameZoneBox');

            if (gameFrame) gameFrame.src = game.url;
            if (gameBox) gameBox.style.display = 'block';
            if (topAd) topAd.style.display = 'flex';
            
            // JAB GAME CHALEGA: Sirf tab laptop par ads active honge aur space adjust hoga
            if (window.innerWidth >= 1250) {
                if (leftAd) leftAd.style.display = 'flex';
                if (rightAd) rightAd.style.display = 'flex';
                if (mainContainer) mainContainer.style.gap = '20px';
                if (gameZoneBox) gameZoneBox.style.maxWidth = '900px';
            }
            
            if (dynamicTitle) {
                dynamicTitle.style.display = 'block';
                dynamicTitle.innerText = `More ${game.cat} Games`; 
            }
            
            const relatedGames = gamesDatabase.filter(g => g.cat === game.cat && g.title !== game.title);
            currentActiveList = relatedGames;
            isModeActive = true;
            renderGames(relatedGames, true); 
            
            history.pushState({ gameOpen: true }, "");
            window.scrollTo({ top: 140, behavior: 'smooth' });
        }

        // RESET LAYOUT FUNCTION (Home ya category click par use hoga)
        function resetLayoutToNormal() {
            const gameBox = document.getElementById('gameBox');
            const dynamicTitle = document.getElementById('moreGamesTitle');
            const topAd = document.getElementById('topAdSlot');
            const gameFrame = document.getElementById('gameFrame');
            
            const leftAd = document.getElementById('leftAdBox');
            const rightAd = document.getElementById('rightAdBox');
            const mainContainer = document.getElementById('mainContainer');
            const gameZoneBox = document.getElementById('gameZoneBox');

            if (gameBox) gameBox.style.display = 'none';
            if (dynamicTitle) dynamicTitle.style.display = 'none';
            if (topAd) topAd.style.display = 'none';
            if (gameFrame) gameFrame.src = "";
            
            // Ads band aur grid layout full wide karega
            if (leftAd) leftAd.style.display = 'none';
            if (rightAd) rightAd.style.display = 'none';
            if (mainContainer) mainContainer.style.gap = '0px';
            if (gameZoneBox) gameZoneBox.style.maxWidth = '100%';
        }

        function createCardHTML(game, isHero = false) {
            return `
                <img src="${game.img}" alt="${game.title}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1579783900882-c0d3dad7b119';">
                <h3>${game.title}</h3>
                ${isHero ? '<span style="background:#00f3ff; color:#000; padding:2px 8px; font-size:0.75rem; font-weight:bold; border-radius:4px; display:inline-block; margin-top:5px;">FEATURED</span>' : ''}
            `;
        }

        // --- DYNAMIC RENDERING ENGINE ---
        function renderGames(list, isMoreGamesMode = false) {
            const gridBox = document.getElementById('gridBox');
            if (!gridBox) return;
            gridBox.innerHTML = "";

            if (!list || list.length === 0) {
                gridBox.innerHTML = "<p style='grid-column: span 6; text-align:center; color:#00f3ff;'>No games found.</p>";
                return;
            }

            const isMobile = window.innerWidth <= 768;

            if (isMobile) {
                let gameIndex = 0;
                if (!isMoreGamesMode) {
                    while (gameIndex < list.length) {
                        const featuredGame = list[gameIndex];
                        if (featuredGame) {
                            const heroCard = document.createElement('div');
                            heroCard.className = "mobile-hero-feature";
                            heroCard.innerHTML = createCardHTML(featuredGame, true);
                            heroCard.onclick = () => playGame(featuredGame);
                            gridBox.appendChild(heroCard);
                        }
                        gameIndex++;

                        let gridCount = 0;
                        while (gameIndex < list.length && gridCount < 9) {
                            const currentAsset = list[gameIndex];
                            if (currentAsset) {
                                const standardCard = document.createElement('div');
                                standardCard.className = "game-card";
                                standardCard.innerHTML = createCardHTML(currentAsset);
                                standardCard.onclick = () => playGame(currentAsset);
                                gridBox.appendChild(standardCard);
                            }
                            gameIndex++;
                            gridCount++;
                        }

                        if (gridCount > 0) {
                            const mobileAd = document.createElement('div');
                            mobileAd.className = "mobile-loop-ad";
                            mobileAd.innerHTML = "<span>[ MOBILE HORIZONTAL AD BANNER ]</span>";
                            gridBox.appendChild(mobileAd);
                        }
                    }
                } else {
                    while (gameIndex < list.length) {
                        let innerChunk = 0;
                        while (gameIndex < list.length && innerChunk < 3) {
                            const standardAsset = list[gameIndex];
                            if (standardAsset) {
                                const card = document.createElement('div');
                                card.className = "game-card";
                                card.innerHTML = createCardHTML(standardAsset);
                                card.onclick = () => playGame(standardAsset);
                                gridBox.appendChild(card);
                            }
                            gameIndex++;
                            innerChunk++;
                        }
                        if (innerChunk > 0) {
                            const miniAd = document.createElement('div');
                            miniAd.className = "mobile-loop-ad";
                            miniAd.innerHTML = "<span>[ REPEATED MULTI-GAME AD BANNER ]</span>";
                            gridBox.appendChild(miniAd);
                        }
                    }
                }

            } else {
                if (!isMoreGamesMode) {
                    let desktopCount = 0;
                    list.forEach((game) => {
                        const card = document.createElement('div');
                        card.className = "game-card";
                        card.innerHTML = createCardHTML(game);
                        card.onclick = () => playGame(game);
                        gridBox.appendChild(card);
                        desktopCount++;

                        if (desktopCount % 12 === 0 && desktopCount > 0) {
                            const lapAd = document.createElement('div');
                            lapAd.className = "laptop-inline-ad";
miniAd.innerHTML = "<span>[ REPEATED MULTI-GAME AD BANNER ]</span>";
                            gridBox.appendChild(miniAd);
                        }
                    }
                }

            } else {
                if (!isMoreGamesMode) {
                    let desktopCount = 0;
                    list.forEach((game) => {
                        const card = document.createElement('div');
                        card.className = "game-card";
                        card.innerHTML = createCardHTML(game);
                        card.onclick = () => playGame(game);
                        gridBox.appendChild(card);
                        desktopCount++;

                        if (desktopCount % 12 === 0 && desktopCount > 0) {
                            const lapAd = document.createElement('div');
                            lapAd.className = "laptop-inline-ad";
                            lapAd.innerHTML = "<span>[ WIDE GOOGLE INLINE LAPTOP AD BANNER (6-COLUMN SPAN) ]</span>";
                            gridBox.appendChild(lapAd);
                        }
                    });
                } else {
                    let gameIndex = 0;
                    while (gameIndex < list.length) {
                        let desktopChunk = 0;
                        while (gameIndex < list.length && desktopChunk < 12) {
                            const standardAsset = list[gameIndex];
                            if (standardAsset) {
                                const card = document.createElement('div');
                                card.className = "game-card";
                                card.innerHTML = createCardHTML(standardAsset);
                                card.onclick = () => playGame(standardAsset);
                                gridBox.appendChild(card);
                            }
                            gameIndex++;
                            desktopChunk++;
                        }
                        if (desktopChunk > 0) {
                            const rowAd = document.createElement('div');
                            rowAd.className = "laptop-inline-ad";
                            rowAd.innerHTML = "<span>[ DETAILED CRAZYGAMES STYLE DYNAMIC AD SLOT ]</span>";
                            gridBox.appendChild(rowAd);
                        }
                    }
                }
            }
        }

        function filterCat(category) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            buttons.forEach(btn => {
                if(btn.innerText.trim().toLowerCase() === category.trim().toLowerCase() || (category === 'All' && btn.innerText.includes('All'))) {
                    btn.classList.add('active');
                }
            });

            // Layout ko wapas default karega jab category change ho
            resetLayoutToNormal();

            isModeActive = false;
            if(category === 'All') {
                currentActiveList = [...gamesDatabase];
            } else {
                currentActiveList = gamesDatabase.filter(g => g.cat === category);
            }
            renderGames(currentActiveList, false);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderGames(currentActiveList, isModeActive);
        });

        window.addEventListener('resize', () => {
            renderGames(currentActiveList, isModeActive);
        });

        window.onpopstate = function(event) {
            const gameBox = document.getElementById('gameBox');
            if (gameBox && gameBox.style.display === 'block') {
                resetLayoutToNormal();
                isModeActive = false;
                currentActiveList = [...gamesDatabase];
                renderGames(currentActiveList, false);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };
        
        // --- FULLSCREEN ---
        function toggleFullScreen() {
            const gameBox = document.getElementById('gameBox');
            if (!document.fullscreenElement) {
                if (gameBox.requestFullscreen) {
                    gameBox.requestFullscreen();
                } else if (gameBox.webkitRequestFullscreen) { /* Safari */
                    gameBox.webkitRequestFullscreen();
                } else if (gameBox.msRequestFullscreen) { /* IE11 */
                    gameBox.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE11 */
                    document.msExitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
