<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underground Gaming - Ultra Smooth Scroll</title>
    <style>
        /* --- ANTI-WHITE FLASH & SMOOTH SCROLL FIX --- */
        html {
            color-scheme: dark; 
            scroll-behavior: smooth !important;
        }

        /* --- GLOBAL & COMMON STYLES --- */
        html, body {
            width: 100%;
            overflow-x: hidden; 
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #0b1d3a !important;
            -webkit-overflow-scrolling: touch !important;
            scroll-behavior: smooth !important;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(11, 29, 58, 0.85), rgba(22, 41, 74, 0.85)), 
                        url('./images/undergroundgaming.png') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 25px 0;
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
            letter-spacing: 2px;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00f3ff;
            color: #fff;
            padding: 8px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #00f3ff;
            color: #0b1d3a;
            box-shadow: 0 0 15px #00f3ff;
        }

        /* --- MAIN CONTAINER ENGINE --- */
        .main-container {
            display: flex;
            width: 98%;           
            max-width: 1600px;    
            justify-content: center;
            margin: 0 auto 40px auto;
            gap: 0px; 
            padding: 10px 0px;     
            box-sizing: border-box;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr)); 
            gap: 25px;             
            width: 100%;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;         
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0; 
            background-color: rgba(7, 20, 38, 0.9);
        }

        .game-card img {
            width: 100%;
            height: 155px;         
            object-fit: cover;
            border-radius: 8px;
            background-color: #16294a;
        }

        .game-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            width: 100%;
            min-width: 0; 
        }

        /* --- TOP AD BANNER --- */
        .top-banner-ad {
            width: 100%;
            max-width: 100%;       
            height: 120px;         
            background: rgba(7, 20, 38, 0.9) !important; 
            border: 2px solid #00f3ff;
            border-radius: 8px;
            display: none; 
            justify-content: center;
            align-items: center;
            color: #00f3ff;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            box-sizing: border-box;
            min-height: 120px; 
        }

        /* --- GAME BOX CONTAINER --- */
        .video-game-container {
            position: relative; 
            width: 100%;
            max-width: 900px; 
            height: 520px; 
            background: #000; 
            border: 3px solid #00f3ff;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            overflow: hidden;
            display: none;
            margin-bottom: 30px;
        }
        
        .video-game-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
            background-color: #000 !important;
        }
      
        #fullscreenBtn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 243, 255, 0.85);
            color: #0b1d3a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            display: none; 
        }

        #fullscreenBtn:hover {
            background: #fff;
            box-shadow: 0 0 15px #00f3ff;
            transform: scale(1.05);
        }

        /* --- PRE-GAME AD SCREEN --- */
        .pre-game-ad-screen {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            background-color: #071426; 
            z-index: 5; 
            display: none;
            box-sizing: border-box;
            padding: 0;
        }

        .ad-box-content {
            border: 3px dashed #00f3ff; 
            background: #0b1d3a;
            width: 100%; 
            height: 100%; 
            max-width: 100%;
            border-radius: 9px; 
            text-align: center;
            box-shadow: inset 0 0 30px rgba(0, 243, 255, 0.2);
            box-sizing: border-box;
            display: flex; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .ad-title {
            color: #00f3ff;
            font-size: 1.6rem;
            font-weight: bold;
            margin: 0 0 15px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .ad-timer-text {
            font-size: 1.1rem;
            color: #fff;
            margin: 0;
        }

        #countdownTimer {
            color: #ff007c;
            font-weight: bold;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(255, 0, 124, 0.5);
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00f3ff;
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.2);
        }

        .game-card h3 {
            font-size: 0.95rem;
            margin: 10px 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; 
            text-transform: capitalize;
        }

        /* --- FIXED INLINE LAPTOP BANNER --- */
        .laptop-inline-ad {
            grid-column: 1 / -1; 
            height: 180px;       
            width: 100%;
            background: rgba(7, 20, 38, 0.9) !important;
            border: 2px dashed #00f3ff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00f3ff;
            font-weight: bold;
            font-size: 1.4rem;
            margin: 15px 0;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.1);
            box-sizing: border-box;
            min-height: 180px;
        }

        /* --- SIDE ADS --- */
        .side-ad {
            display: none; 
            width: 160px;
            background: rgba(7, 20, 38, 0.9) !important;
            border: 2px dashed #00f3ff;
            border-radius: 8px;
            color: #00f3ff;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            box-sizing: border-box;
            height: 625px; 
            margin-top: 0;
        }

        .side-ad span {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* --- 📱 MOBILE RESPONSIVE --- */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.9rem;
            }

            .main-container {
                width: 96%;
            }

            .games-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr)) !important; 
                gap: 10px;
            }

            .game-card img {
                height: 90px;
            }

            .game-card h3 {
                font-size: 0.8rem;
            }

            .mobile-hero-feature {
                grid-column: span 3;
                background: rgba(7, 20, 38, 0.9);
                border: 2px solid #00f3ff;
                border-radius: 14px;
                padding: 12px;
                cursor: pointer;
                text-align: center;
                box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            }

            .mobile-hero-feature img {
                width: 100%;
                height: 180px;
                object-fit: cover;
                border-radius: 10px;
            }

            .mobile-hero-feature h3 {
                font-size: 1.2rem;
                color: #00f3ff;
                margin: 10px 0 2px 0;
            }

            .mobile-loop-ad {
                grid-column: 1 / -1; 
                height: 100px;
                background: rgba(7, 20, 38, 0.9) !important;
                border: 2px dashed #ff007c;
                border-radius: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
                color: #ff007c;
                font-weight: bold;
                font-size: 0.9rem;
                margin: 10px 0;
                min-height: 100px;
            }

            .video-game-container {
                height: 380px; 
                border-width: 2px;
            }

            .top-banner-ad {
                height: 65px;
                font-size: 0.8rem;
                min-height: 65px;
            }

            .ad-box-content {
                padding: 20px 15px;
            }
            .ad-title {
                font-size: 1.3rem;
            }
            .ad-timer-text {
                font-size: 0.95rem;
            }
        }

        @media (min-width: 1250px) {
            .main-container {
                display: flex;
                justify-content: center;
                align-items: flex-start;
                width: 98%;
                max-width: 1600px; 
                margin: 0 auto;
                gap: 20px;
            }
            .game-zone {
                flex: 1;
                width: 100%; 
            }
        }
    </style>
</head>

        ];

        let currentActiveList = [...gamesDatabase];
        let isModeActive = false;
        let currentlyPlayingGame = null; 
        let adCountdownInterval = null; 

        function playGame(game) {
            currentlyPlayingGame = game; 
            
            const gameFrame = document.getElementById('gameFrame');
            const gameBox = document.getElementById('gameBox');
            const topAd = document.getElementById('topAdSlot');
            const dynamicTitle = document.getElementById('moreGamesTitle');
            const leftAd = document.getElementById('leftAdBox');
            const rightAd = document.getElementById('rightAdBox');
            
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const preGameAdScreen = document.getElementById('preGameAdScreen');
            const countdownTimer = document.getElementById('countdownTimer');

            if (adCountdownInterval) clearInterval(adCountdownInterval);

            if (gameFrame) {
                gameFrame.src = "";
                gameFrame.style.display = 'none';
            }
            if (fullscreenBtn) fullscreenBtn.style.display = 'none';
            
            if (gameBox) gameBox.style.display = 'block';
            if (preGameAdScreen) preGameAdScreen.style.display = 'flex'; 
            if (topAd) topAd.style.display = 'flex';
            
            if (window.innerWidth >= 1250) {
                if (leftAd) leftAd.style.display = 'flex';
                if (rightAd) rightAd.style.display = 'flex';
            }
            
            if (dynamicTitle) {
                dynamicTitle.style.display = 'block';
                dynamicTitle.innerText = `More ${game.cat} Games`; 
            }
            
            const relatedGames = gamesDatabase.filter(g => g.cat === game.cat && g.title !== game.title);
            currentActiveList = relatedGames;
            isModeActive = true;
            renderGames(relatedGames, true); 
            
            history.pushState({ gameOpen: true }, "");
            
            // --- SMOOTH SCROLL ENHANCEMENT ---
            setTimeout(() => {
                const yOffset = -15; 
                const yPos = gameBox.getBoundingClientRect().top + window.pageYOffset + yOffset;
                window.scrollTo({ top: yPos, behavior: 'smooth' });
            }, 150);

            // --- 5 SECOND TIMER LOGIC ---
            let timeLeft = 5;
            if (countdownTimer) countdownTimer.innerText = timeLeft;

            adCountdownInterval = setInterval(() => {
                timeLeft--;
                if (countdownTimer) countdownTimer.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(adCountdownInterval); 
                    if (preGameAdScreen) preGameAdScreen.style.display = 'none'; 
                    if (gameFrame) {
                        gameFrame.style.display = 'block'; 
                        gameFrame.src = game.url; 
                    }
                    if (fullscreenBtn) fullscreenBtn.style.display = 'block'; 
                }
            }, 1000);
        }

        function createCardHTML(game, isHero = false) {
            return `
                <img src="${game.img}" alt="${game.title}" loading="lazy" decoding="async" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1579783900882-c0d3dad7b119';">
                <h3>${game.title}</h3>
                ${isHero ? '<span style="background:#00f3ff; color:#000; padding:2px 8px; font-size:0.75rem; font-weight:bold; border-radius:4px; display:inline-block; margin-top:5px;">FEATURED</span>' : ''}
            `;
        }

        // --- DYNAMIC RENDERING ENGINE ---
        function renderGames(list, isMoreGamesMode = false) {
            const gridBox = document.getElementById('gridBox');
            const gameBox = document.getElementById('gameBox');
            const gameZone = document.querySelector('.game-zone');
            const dynamicTitle = document.getElementById('moreGamesTitle');

            if (!gridBox) return;
            gridBox.innerHTML = "";

            if (gameZone && gameBox && gameBox.parentNode !== gameZone) {
                gameZone.insertBefore(gameBox, dynamicTitle);
            }

            if (gameBox) {
                gameBox.style.gridColumn = "";
                gameBox.style.margin = "";
            }

            if (!list || list.length === 0) {
                gridBox.innerHTML = "<p style='grid-column: 1 / -1; text-align:center; color:#00f3ff;'>No games found.</p>";
                return;
            }

            const isMobile = window.innerWidth <= 768;

            if (isMobile) {
                let gameIndex = 0;
                if (!isMoreGamesMode) {
                    while (gameIndex < list.length) {
                        const featuredGame = list[gameIndex];
                        if (featuredGame) {
                            const heroCard = document.createElement('div');
                            heroCard.className = "mobile-hero-feature";
                            heroCard.innerHTML = createCardHTML(featuredGame, true);
                            heroCard.onclick = () => playGame(featuredGame);
                            gridBox.appendChild(heroCard);
                        }
                        gameIndex++;

                        let gridCount = 0;
                        while (gameIndex < list.length && gridCount < 6) { 
                            const currentAsset = list[gameIndex];
                            if (currentAsset) {
                                const standardCard = document.createElement('div');
                                standardCard.className = "game-card";
                                standardCard.innerHTML = createCardHTML(currentAsset);
                                standardCard.onclick = () => playGame(currentAsset);
                                gridBox.appendChild(standardCard);
                            }
                            gameIndex++;
                            gridCount++;
                        }

                        if (gridCount > 0) {
                            const mobileAd = document.createElement('div');
                            mobileAd.className = "mobile-loop-ad";
                            mobileAd.innerHTML = "<span>[ MOBILE HORIZONTAL AD BANNER ]</span>";
                            gridBox.appendChild(mobileAd);
                        }
                    }
                } else {
                    while (gameIndex < list.length) {
                        let innerChunk = 0;
                        while (gameIndex < list.length && innerChunk < 6) {
                            const standardAsset = list[gameIndex];
                            if (standardAsset) {
                                const card = document.createElement('div');
                                card.className = "game-card";
                                card.innerHTML = createCardHTML(standardAsset);
                                card.onclick = () => playGame(standardAsset);
                                gridBox.appendChild(card);
                            }
                            gameIndex++;
                            innerChunk++;
                        }
                        if (innerChunk > 0) {
                            const miniAd = document.createElement('div');
                            miniAd.className = "mobile-loop-ad";
                            miniAd.innerHTML = "<span>[ REPEATED MULTI-GAME AD BANNER ]</span>";
                            gridBox.appendChild(miniAd);
                        }
                    }
                }

            } else {
                if (!isMoreGamesMode) {
                    let desktopCount = 0;
                    list.forEach((game) => {
                        const card = document.createElement('div');
                        card.className = "game-card";
                        card.innerHTML = createCardHTML(game);
                        card.onclick = () => playGame(game);
                        gridBox.appendChild(card);
                        desktopCount++;

                        if (desktopCount % 12 === 0 && desktopCount > 0) {
                            const lapAd = document.createElement('div');
                            lapAd.className = "laptop-inline-ad";
                            lapAd.innerHTML = "<span>[ WIDE GOOGLE INLINE LAPTOP AD BANNER (FULL WIDTH) ]</span>";
                            gridBox.appendChild(lapAd);
                        }
                    });
                } else {
                    let gameIndex = 0;
                    while (gameIndex < list.length) {
                        let desktopChunk = 0;
                        while (gameIndex < list.length && desktopChunk < 12) { 
                            const standardAsset = list[gameIndex];
                            if (standardAsset) {
                                const card = document.createElement('div');
                                card.className = "game-card";
                                card.innerHTML = createCardHTML(standardAsset);
                                card.onclick = () => playGame(standardAsset);
                                gridBox.appendChild(card);
                            }
                            gameIndex++;
                            desktopChunk++;
                        }
                        if (desktopChunk > 0) {
                            const rowAd = document.createElement('div');
                            rowAd.className = "laptop-inline-ad";
                            rowAd.innerHTML = "<span>[ DETAILED CRAZYGAMES STYLE DYNAMIC AD SLOT ]</span>";
                            gridBox.appendChild(rowAd);
                        }
                    }
                }
            }
        }

        function filterCat(category) {
            if (adCountdownInterval) clearInterval(adCountdownInterval);

            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            buttons.forEach(btn => {
                if(btn.innerText.trim().toLowerCase() === category.trim().toLowerCase() || (category === 'All' && btn.innerText.includes('All'))) {
                    btn.classList.add('active');
                }
            });

            const gameBox = document.getElementById('gameBox');
            const dynamicTitle = document.getElementById('moreGamesTitle');
            const topAd = document.getElementById('topAdSlot');
            const gameFrame = document.getElementById('gameFrame');
            const preGameAdScreen = document.getElementById('preGameAdScreen');
            
            const leftAd = document.getElementById('leftAdBox');
            const rightAd = document.getElementById('rightAdBox');
            
            if (gameBox) gameBox.style.display = 'none';
            if (dynamicTitle) dynamicTitle.style.display = 'none';
            if (topAd) topAd.style.display = 'none';
            if (gameFrame) gameFrame.src = "";
            if (preGameAdScreen) preGameAdScreen.style.display = 'none';
            if (leftAd) leftAd.style.display = 'none';
            if (rightAd) rightAd.style.display = 'none';

            isModeActive = false;
            currentlyPlayingGame = null; 
            if(category === 'All') {
                currentActiveList = [...gamesDatabase];
            } else {
                currentActiveList = gamesDatabase.filter(g => g.cat === category);
            }
            renderGames(currentActiveList, false);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderGames(currentActiveList, isModeActive);
        });

        /* --- ANTI-SCROLL JUMP WINDOW LOCK --- */
        let cachedWindowWidth = window.innerWidth;
        window.addEventListener('resize', () => {
            if (Math.abs(window.innerWidth - cachedWindowWidth) > 40) {
                cachedWindowWidth = window.innerWidth;
                renderGames(currentActiveList, isModeActive);
            }
        });

        window.onpopstate = function(event) {
            if (adCountdownInterval) clearInterval(adCountdownInterval);

            const gameBox = document.getElementById('gameBox');
            const dynamicTitle = document.getElementById('moreGamesTitle');
            const topAd = document.getElementById('topAdSlot');
            const gameFrame = document.getElementById('gameFrame');
            const leftAd = document.getElementById('leftAdBox');
            const rightAd = document.getElementById('rightAdBox');
            const preGameAdScreen = document.getElementById('preGameAdScreen');
            
            if (gameBox && gameBox.style.display === 'block') {
                gameBox.style.display = 'none';
                if (dynamicTitle) dynamicTitle.style.display = 'none';
                if (topAd) topAd.style.display = 'none';
                if (gameFrame) gameFrame.src = ""; 
                if (preGameAdScreen) preGameAdScreen.style.display = 'none';
                if (leftAd) leftAd.style.display = 'none';
                if (rightAd) rightAd.style.display = 'none';
                
                isModeActive = false;
                currentlyPlayingGame = null;
                currentActiveList = [...gamesDatabase];
                renderGames(currentActiveList, false);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };
        
        function toggleFullScreen() {
            const gameBox = document.getElementById('gameBox');
            if (!document.fullscreenElement) {
                if (gameBox.requestFullscreen) {
                    gameBox.requestFullscreen();
                } else if (gameBox.webkitRequestFullscreen) { 
                    gameBox.webkitRequestFullscreen();
                } else if (gameBox.msRequestFullscreen) { 
                    gameBox.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { 
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { 
                    document.msExitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
