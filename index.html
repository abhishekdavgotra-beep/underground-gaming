<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underground Gaming - Poki Style</title>
    <style>
        /* Asli Dark Blue Theme Layout Jo Tumhe Pasand Hai */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1d3a, #16294a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        /* Category Filter Buttons */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00f3ff;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #00f3ff;
            color: #0b1d3a;
            box-shadow: 0 0 15px #00f3ff;
        }

        /* 3-Column Master Layout (Ads + Game Area + Ads) */
        .main-container {
            display: flex;
            width: 95%;
            max-width: 1400px;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
        }

        /* Side Ads Panels */
        .side-ad {
            width: 180px;
            min-height: 600px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Central Game Zone */
        .game-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        /* Game Screen ke Andar ka TOP AD BANNER */
.top-banner-ad {
    width: 100%;
    height: 90px;
    background: rgba(0, 0, 0, 0.5);
    border: 1px dashed #00f3ff;
    border-radius: 8px;
    display: none; /* <-- Isse ad pehle se chhupa rahega aur game click hone par hi khulega */
    justify-content: center;
    align-items: center;
    color: #00f3ff;
    font-weight: bold;
    font-size: 0.9rem;
}
            justify-content: center;
            align-items: center;
            color: #0

        /* Big Theater Mode Game Container */
.video-game-container {
    width: 100%;
    max-width: 900px; /* Laptop/Desktop par ekdum perfect bada size dikhane ke liye */
    height: 500px; /* Game ki height */
    background: #000000; /* Pure black background box ke andar */
    border: 3px solid #00f3ff;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
    overflow: hidden;
    position: relative;
    display: none;
    margin: 20px auto;
}

.video-game-container iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #000;
}

        /* Grid System for Games Card List Below */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            width: 100%;
            margin-top: 20px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00f3ff;
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.2);
        }

        .game-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #16294a;
        }

        .game-card h3 {
            font-size: 0.95rem;
            margin: 10px 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-transform: capitalize;
        }
    </style>
</head>
<body>

    <header>
        <h1>UNDERGROUND GAMING</h1>
    </header>

    <div class="filters">
        <button class="filter-btn active" onclick="filterCat('All')">All Games</button>
        <button class="filter-btn" onclick="filterCat('Action')">Action</button>
        <button class="filter-btn" onclick="filterCat('Racing')">Racing</button>
        <button class="filter-btn" onclick="filterCat('Retro')">Retro</button>
    </div>

    <div class="main-container">
        
        <div class="side-ad">ADVERTISEMENT</div>

        <div class="game-zone">
            
            <div class="top-banner-ad" id="topAdSlot" style="display: none; justify-content: center; align-items:center; background: #111; color: #fff; padding: 10px; margin-bottom: 15px; border-radius: 8px;">
                <span>[ GOOGLE BANNER AD SLOT - 728x90 ]</span>
            </div>

            <div class="video-game-container" id="gameBox" style="display: none;">
        <iframe id="gameFrame" src=""></iframe>
    </div>

    <div class="games-grid" id="gridBox">
    </div>

    <h2 id="moreGamesTitle" style="display: none; color: #00f3ff; margin-top: 30px; font-size: 1.4rem; text-align: left; width: 100%;">More Awesome Games</h2>

        <div class="side-ad">ADVERTISEMENT</div>

    </div>

    <script>
        // --- 100% CORRECT CLEANED DATABASE ---
        const gamesDatabase = [
            { title: "Drive Quest", cat: "Racing", img: "./images/bike.jpg", url: "https://playgama.com/export/game/drive-quest" },
            { title: "Flappy Bird Classic", cat: "Action", img: "./images/flappy.jpg", url: "./flappy/index.html" },
            { title: "Pac-Man Retro", cat: "Retro", img: "./images/ludo.jpg", url: "https://pacman.live/play.html" }
        ];

        const gridBox = document.getElementById('gridBox');
        const gameFrame = document.getElementById('gameFrame');

        // Function to load and render cards dynamically
        function renderGames(list, isRelatedMode = false) {
    const gridBox = document.getElementById('gridBox');
    
    // Agar normal home page khul raha hai toh grid saaf karo, category filter mein nahi
    if (!isRelatedMode && gridBox) {
        gridBox.innerHTML = "";
    }
    
    list.forEach(game => {
        const card = document.createElement('div');
        card.className = "game-card";
        
        card.onclick = () => {
            const gameFrame = document.getElementById('gameFrame');
            const gameBox = document.getElementById('gameBox');
            const topAd = document.querySelector('.top-banner-ad') || document.getElementById('topAdSlot');
            const dynamicTitle = document.getElementById('moreGamesTitle');

            // 1. Black Box mein game ka URL load karo aur use dikhao
            if (gameFrame) gameFrame.src = game.url;
            if (gameBox) gameBox.style.display = 'block';
            
            // 2. Top advertisement banner ko show karo
            if (topAd) topAd.style.display = 'block'; 
            
            // 3. Heading badlo aur show karo (Jaise: More Action Games)
            if (dynamicTitle) {
                dynamicTitle.style.display = 'block';
                dynamicTitle.innerText = More ${game.cat} Games; 
            }
            
            // 4. 🔥 SMART FILTER ENGINE: Sirf vohi same category ke games niche filter karo
            const relatedGames = gamesDatabase.filter(g => g.cat === game.cat && g.title !== game.title);
            
            // Niche wale grid ko saaf karke ab sirf filter huye games dikhao
            if (gridBox) {
                gridBox.innerHTML = "";
                renderGames(relatedGames, true); // True bheja taaki related mode loop chale
            }
            
            // 5. Phone back button handler ke liye history entry
            history.pushState({ gameOpen: true }, "");
            
            // Smooth scroll direct game box par le jane ke liye
            window.scrollTo({ top: 120, behavior: 'smooth' });
        };

                card.innerHTML = `
                    <img src="${game.img}" alt="${game.title}" onerror="this.src='https://images.unsplash.com/photo-1579783900882-c0d3dad7b119'">
                    <h3>${game.title}</h3>
                `;
                gridBox.appendChild(card);
            });
        }

        // Filter engine
        function filterCat(category) {
            // Update active button state
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if(category === 'All') {
                renderGames(gamesDatabase);
            } else {
                const filtered = gamesDatabase.filter(g => g.cat === category);
                renderGames(filtered);
            }
        }

        // App Initializer
        renderGames(gamesDatabase);

        window.onpopstate = function(event) {
    const gameBox = document.getElementById('gameBox');
    const moreGamesTitle = document.getElementById('moreGamesTitle');
    const gameFrame = document.getElementById('gameFrame');
    const topAd = document.querySelector('.top-banner-ad');
    
    if (gameBox && gameBox.style.display === 'block') {
        gameBox.style.display = 'none';
        if (moreGamesTitle) moreGamesTitle.style.display = 'none';
        if (gameFrame) gameFrame.src = ""; // 3. Yahan src set karne ka system ekdum perfect hai
        if (topAd) topAd.style.display = 'none'; // Top ad ko bhi chhupa do
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
};
    </script>
</body>
</html>
