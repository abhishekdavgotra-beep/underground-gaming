<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underground Gaming</title>
    <style>
        /* Premium Poki-Style Dark Blue Background Theme */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1d3a, #16294a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        /* Category Menu Buttons */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00f3ff;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #00f3ff;
            color: #0b1d3a;
            box-shadow: 0 0 15px #00f3ff;
        }

        /* Standard Master 3-Column Layout */
        .main-container {
            display: flex;
            width: 98%;
            max-width: 1500px;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }

        /* Side Ads - Thoda slim (160px width) taaki look clean lage */
        .side-ad {
            width: 160px;
            min-height: 700px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Main Center Workspace */
        .game-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        /* Game Screen ke Andar ka TOP AD BANNER */
        .top-banner-ad {
            width: 100%;
            height: 90px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px dashed #00f3ff;
            border-radius: 8px;
            display: none; /* Game click hone par hi dikhega */
            justify-content: center;
            align-items: center;
            color: #00f3ff;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Bada Responsive Theater Mode Window */
        .video-game-container {
            width: 100%;
            height: 650px; /* Bada laptop screen area */
            background: #000;
            border: 3px solid #00f3ff;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
            overflow: hidden;
            display: none; /* Shuru mein hidden */
        }

        /* Iframe pure space ko stretch karega */
        .video-game-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Dynamic Grid System for Cards and Middle Ads */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            width: 100%;
        }

        /* Game Card Design */
        .game-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00f3ff;
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.2);
        }

        .game-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #16294a;
        }

        .game-card h3 {
            font-size: 0.95rem;
            margin: 10px 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-transform: capitalize;
        }

        /* Middle Advertisement Block in Cards Grid */
        .inline-ad-card {
            background: rgba(0, 0, 0, 0.5);
            border: 2px dashed rgba(0, 243, 255, 0.4);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            font-size: 0.8rem;
            color: #00f3ff;
            font-weight: bold;
            min-height: 150px;
        }
    </style>
</head>
<body>

    <header>
        <h1>UNDERGROUND GAMING</h1>
    </header>

    <div class="filters">
        <button class="filter-btn active" onclick="filterCat('All')">All Games</button>
        <button class="filter-btn" onclick="filterCat('Action')">Action</button>
        <button class="filter-btn" onclick="filterCat('Racing')">Racing</button>
        <button class="filter-btn" onclick="filterCat('Retro')">Retro</button>
    </div>

    <div class="main-container">
        
        <div class="side-ad">ADVERTISEMENT</div>

        <div class="game-zone">
            
            <div class="top-banner-ad">
                <span>[ GOOGLE BANNER AD SLOT - 728x90 ]</span>
            </div>

            <div class="video-game-container">
                <iframe id="gameFrame" src=""></iframe>
            </div>

            <div class="games-grid" id="gridBox"></div>

        </div>

        <div class="side-ad">ADVERTISEMENT</div>

    </div>

    <script>
        // Clean and Correct Database
        const gamesDatabase = [
            { type: "game", title: "Drive Quest", cat: "Racing", img: "./images/bike.jpg", url: "https://playgama.com/export/game/drive-quest" },
            { type: "game", title: "Flappy Bird Classic", cat: "Action", img: "./images/flappy.jpg", url: "./flappy/index.html" },
            // Beech mein ad card automatically load karne ka system
            { type: "ad", text: "INLINE AD SLOT" },
            { type: "game", title: "Pac-Man Retro", cat: "Retro", img: "./images/ludo.jpg", url: "https://pacman.live/play.html" }
        ];

        const gridBox = document.getElementById('gridBox');
        const gameFrame = document.getElementById('gameFrame');

        function renderGames(list) {
            gridBox.innerHTML = "";
            list.forEach(item => {
                if (item.type === "game") {
                    const card = document.createElement('div');
                    card.className = "game-card";
                    card.onclick = () => {
                        // Click hote hi game window aur banner active
                        document.querySelector('.top-banner-ad').style.display = 'flex';
                        document.querySelector('.video-game-container').style.display = 'block';
                        
                        gameFrame.src = item.url;
                        window.scrollTo({ top: 80, behavior: 'smooth' });
                    };

                    card.innerHTML = `
                        <img src="${item.img}" alt="${item.title}" onerror="this.src='https://images.unsplash.com/photo-1579783900882-c0d3dad7b119'">
                        <h3>${item.title}</h3>
                    `;
                    gridBox.appendChild(card);
                } else if (item.type === "ad") {
                    // Middle ad layout setup
                    const adCard = document.createElement('div');
                    adCard.className = "inline-ad-card";
                    adCard.innerHTML = <span>⚡<br>${item.text}</span>;
                    gridBox.appendChild(adCard);
                }
            });
        }

        function filterCat(category) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if(category === 'All') {
                renderGames(gamesDatabase);
            } else {
                // Filter games only and keep relevant category
                const filtered = gamesDatabase.filter(g => g.type === "game" && g.cat === category);
                renderGames(filtered);
            }
        }

        // Initialize Layout
        renderGames(gamesDatabase);
    </script>
</body>
</html>
