<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underground Gaming</title>
    <style>
        /* Poki Style Modern Responsive Theme */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1d3a, #16294a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 20px 0 10px 0;
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        /* Centered Category Buttons */
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            justify-content: center;
            width: 95%;
            max-width: 800px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00f3ff;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #00f3ff;
            color: #0b1d3a;
            box-shadow: 0 0 12px #00f3ff;
        }

        /* Clean Central Workspace (No Side Ads) */
        .main-container {
            width: 92%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-bottom: 40px;
        }

        /* Top Banner Ad - Hidden by default, opens on game tap */
        .top-banner-ad {
            width: 100%;
            height: 75px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px dashed #00f3ff;
            border-radius: 12px;
            display: none; 
            justify-content: center;
            align-items: center;
            color: #00f3ff;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
            box-sizing: border-box;
        }

        /* Fluid Dynamic Responsive Game Window */
        .video-game-container {
            width: 100%;
            height: 65vh; 
            max-height: 550px;
            background: #000;
            border: 3px solid #00f3ff;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
            overflow: hidden;
            display: none;
        }

        .video-game-container iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            display: block;
        }

        /* Grid Layout for Games & Integrated Ads */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
            margin-top: 10px;
        }

        /* Game Card Block Design */
        .game-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .game-card:hover {
            transform: scale(1.03);
            border-color: #00f3ff;
            box-shadow: 0 4px 12px rgba(0, 243, 255, 0.25);
        }

        .game-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #16294a;
        }

        .game-card h3 {
            font-size: 0.9rem;
            margin: 8px 0 4px 0;
