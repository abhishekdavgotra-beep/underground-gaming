<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underground Gaming - Shake & Jump Fixed</title>
    <style>
        /* --- ⚡ GLOBAL FIXED RESET: STOPS SHAKING & WOBBLING --- */
        *, *::before, *::after {
            box-sizing: border-box; /* Force border & padding to stay inside width */
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden; /* Strictly prevent any left-right shaking */
            background: #0b1d3a;
            -webkit-text-size-adjust: 100%;
            -webkit-overflow-scrolling: touch;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1d3a, #16294a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 25px 0;
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
            letter-spacing: 2px;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00f3ff;
            color: #fff;
            padding: 8px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #00f3ff;
            color: #0b1d3a;
            box-shadow: 0 0 15px #00f3ff;
        }

        /* --- MAIN CONTAINER ENGINE --- */
        .main-container {
            display: flex;
            width: 98%;           
            max-width: 1600px;    
            justify-content: center;
            margin: 0 auto 40px auto;
            gap: 0px; 
            padding: 10px 0px;     
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 25px;             
            width: 100%;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;         
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-card img {
            width: 100%;
            height: 155px;         
            object-fit: cover;
            border-radius: 8px;
            background-color: #16294a;
        }

        .game-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            width: 100%;
        }

        /* --- TOP AD BANNER --- */
        .top-banner-ad {
            width: 100%;
            max-width: 100%;       
            height: 120px;         
            background: #071426;
            border: 2px solid #00f3ff;
            border-radius: 8px;
            display: none; 
            justify-content: center;
            align-items: center;
            color: #00f3ff;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .video-game-container {
            position: relative; 
            width: 100%;
            max-width: 900px; 
            height: 520px; 
            background: #000; 
            border: 3px solid #00f3ff;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            overflow: hidden;
            display: none;
            margin-bottom: 30px;
        }
        
        .video-game-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
            background-color: #000 !important;
        }
      
        #fullscreenBtn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 243, 255, 0.85);
            color: #0b1d3a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        #fullscreenBtn:hover {
            background: #fff;
            box-shadow: 0 0 15px #00f3ff;
            transform: scale(1.05);
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00f3ff;
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.2);
        }

        .game-card h3 {
            font-size: 0.95rem;
            margin: 10px 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-transform: capitalize;
        }

        /* --- FIXED INLINE LAPTOP BANNER --- */
        .laptop-inline-ad {
            grid-column: 1 / -1; 
            height: 180px;       
            width: 100%;
            background: #071426;
            border: 2px dashed #00f3ff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00f3ff;
            font-weight: bold;
            font-size: 1.4rem;
            margin: 15px 0;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.1);
        }

        /* --- SIDE ADS --- */
        .side-ad {
            display: none; 
            width: 160px;
            background: #071426;
            border: 2px dashed #00f3ff;
            border-radius: 8px;
            color: #00f3ff;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            height: 625px; 
            margin-top: 0;
        }

        .side-ad span {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* --- 📱 MOBILE RESPONSIVE --- */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.9rem;
            }

            .main-container {
                width: 100%; /* Pure screen adjustment */
                padding: 10px 8px;
            }

            .games-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 10px;
            }

            .game-card img {
                height: 90px;
            }

            .game-card h3 {
                font-size: 0.8rem;
            }

            .mobile-hero-feature {
                grid-column: span 3;
                background: rgba(255, 255, 255, 0.04);
                border: 2px solid #00f3ff;
                border-radius: 14px;
                padding: 12px;
                cursor: pointer;
                text-align: center;
                box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            }

            .mobile-hero-feature img {
                width: 100%;
                height: 180px;
                object-fit: cover;
                border-radius: 10px;
            }

            .mobile-hero-feature h3 {
                font-size: 1.2rem;
                color: #00f3ff;
                margin: 10px 0 2px 0;
            }

            .mobile-loop-ad {
                grid-column: 1 / -1; 
                height: 100px;
                background: #071426;
                border: 2px dashed #ff007c;
                border-radius: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
                color: #ff007c;
                font-weight: bold;
                font-size: 0.9rem;
                margin: 10px 0;
                width: 100%;
            }

            .video-game-container {
                height: 280px;
                border-width: 2px;
            }

            .top-banner-ad {
                height: 65px;
                font-size: 0.8rem;
            }
        }

        @media (min-width: 1250px) {
            .main-container {
                display: flex;
                justify-content: center;
                align-items: flex-start;
                width: 98%;
                max-width: 1600px; 
                margin: 0 auto;
                gap: 20px;
            }
            .game-zone {
                flex: 1;
                width: 100%; 
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>UNDERGROUND GAMING</h1>
    </header>

    <div class="filters">
        <button class="filter-btn active" onclick="filterCat('All')">All Games</button>
        <button class="filter-btn" onclick="filterCat('Action')">Action</button>
        <button class="filter-btn" onclick="filterCat('Racing')">Racing</button>
        <button class="filter-btn" onclick="filterCat('Retro')">Retro</button>
    </div>

    <div class="main-container">
        
        <div class="side-ad left-ad" id="leftAdBox">
            <span>[ AD BANNER ]</span>
        </div>

        <div class="game-zone">
            
            <div class="top-banner-ad" id="topAdSlot">
                <span>[ GOOGLE RESPONSIVE BANNER AD ]</span>
            </div>

            <div class="video-game-container" id="gameBox">
                <button id="fullscreenBtn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
                <iframe id="gameFrame" src="" allowfullscreen allowtransparency="true" style="background-color: #000;"></iframe>
